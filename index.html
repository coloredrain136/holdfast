<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holdfast">
<meta name="theme-color" content="#16110d">
<meta name="format-detection" content="telephone=no">
<title>Holdfast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ================= Design tokens (Apple glass, dark, warm gold) ================= */
:root {
  --gold: #e8b54a; --gold-2: #ffd86b; --gold-deep: #b98424; --on-gold: #2a1a06;
  --red: #ef6b5a; --green: #7ad46a; --blue: #6fb6ff; --purple: #b38cff;
  --text: #f7f0e3; --text-2: rgba(247,240,227,.70); --text-3: rgba(247,240,227,.45);
  --bg: #16110d;
  --glass: rgba(32,25,20,.50); --glass-strong: rgba(26,20,16,.74); --glass-soft: rgba(255,245,225,.07);
  --glass-border: rgba(255,238,210,.15); --glass-hi: rgba(255,255,255,.13);
  --blur: blur(22px) saturate(165%);
  --shadow-1: 0 4px 14px rgba(0,0,0,.28); --shadow-2: 0 14px 40px rgba(0,0,0,.45);
  --r-xs: 8px; --r-s: 12px; --r-m: 16px; --r-l: 22px; --r-xl: 28px; --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 28px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --hud-h: 46px; --bar-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { position: fixed; inset: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
#cv { position: fixed; inset: 0; touch-action: none; display: block; }
.hidden { display: none !important; }

/* ================= Glass primitives ================= */
.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-hi); }
.glass-strong { background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: 48px; padding: 0 var(--sp-5);
  border-radius: var(--r-m); font-weight: 650; font-size: 16px; letter-spacing: .1px; transition: transform .12s var(--ease), opacity .2s;
  background: var(--glass-soft); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-hi); }
.btn:active { transform: scale(.96); }
.btn[disabled], .btn.disabled { opacity: .42; pointer-events: none; }
.btn-gold { background: linear-gradient(180deg, #f6d27a, #d49b34 60%, #b98424); color: var(--on-gold); border-color: rgba(255,230,170,.6);
  box-shadow: 0 6px 18px rgba(232,181,74,.28), inset 0 1px 0 rgba(255,255,255,.55); text-shadow: 0 1px 0 rgba(255,240,200,.4); }
.btn-red { background: linear-gradient(180deg, rgba(239,107,90,.95), rgba(190,64,50,.95)); border-color: rgba(255,170,150,.4); color: #fff; }
.btn-block { width: 100%; }
.btn-icon { width: 44px; min-height: 44px; padding: 0; border-radius: var(--r-pill); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-pill); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); background: rgba(232,181,74,.16); color: var(--gold-2); font-size: 13px; font-weight: 700; border: 1px solid rgba(232,181,74,.35); }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.gold { color: var(--gold-2); }
.ico { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { margin: 0; }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: .3px; }

/* ================= HUD ================= */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 6px) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px);
  display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 10; }
#hud .pill { pointer-events: auto; }
#hud .grow { flex: 1; }
#hud .hearts.hit { animation: thump .45s var(--ease); }
@keyframes thump { 30% { transform: scale(1.18); background: rgba(239,107,90,.5); } }
#boss { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + var(--hud-h) + 4px); width: min(320px, 80vw); padding: 6px 10px 8px;
  border-radius: var(--r-s); z-index: 10; pointer-events: none; }
#boss .name { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #ffb4a8; margin-bottom: 4px; }
#boss .track { height: 7px; border-radius: 4px; background: rgba(0,0,0,.5); overflow: hidden; }
#boss .fill { height: 100%; background: linear-gradient(90deg, #ff5a3a, #ffb347); width: 100%; transition: width .2s; }

/* bottom bar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 calc(var(--safe-r) + 10px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 10px);
  display: flex; gap: 8px; align-items: stretch; z-index: 10; height: calc(var(--bar-h) + var(--safe-b) + 8px); }
#bar .side { width: 56px; border-radius: var(--r-l); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
#bar .side:active, #callwave:active { transform: scale(.95); }
#callwave { flex: 1; border-radius: var(--r-l); display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; transition: transform .12s var(--ease), opacity .2s; }
#callwave .lbl { flex: 1; min-width: 0; }
#callwave .t1 { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#callwave .t2 { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#callwave.ready { background: linear-gradient(180deg, rgba(246,210,122,.95), rgba(196,140,40,.95)); color: var(--on-gold); border-color: rgba(255,230,170,.6); }
#callwave.ready .t2 { color: rgba(42,26,6,.7); }
#callwave.busy { opacity: .75; }
#callwave .foes { display: flex; gap: 4px; align-items: center; }
#callwave .foe { position: relative; width: 26px; height: 26px; }
#callwave .foe img { width: 26px; height: 26px; }
#callwave .foe b { position: absolute; right: -3px; bottom: -3px; font-size: 10px; background: rgba(0,0,0,.7); color: #fff; border-radius: 6px; padding: 0 3px; line-height: 14px; }
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0; transition: opacity .5s;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(200,30,20,.55) 100%); }
#vignette.on { opacity: 1; transition: none; }

/* radial build menu */
#radial { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
#radial .ring-btn { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: auto;
  display: flex; align-items: center; justify-content: center; animation: pop .22s var(--ease) both; }
#radial .ring-btn img { width: 46px; height: 46px; margin-top: -4px; }
#radial .ring-btn .cost { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 8px;
  background: rgba(20,14,10,.9); color: var(--gold-2); white-space: nowrap; border: 1px solid rgba(232,181,74,.4); font-variant-numeric: tabular-nums; }
#radial .ring-btn.poor .cost { color: #ff9a8a; border-color: rgba(239,107,90,.5); }
#radial .ring-btn.poor img { opacity: .55; }
#radial .ring-btn.locked img { filter: grayscale(1) brightness(.5); }
#radial .ring-btn.locked .cost { color: var(--text-2); border-color: var(--glass-border); }
#radial .ring-btn.sel { border-color: var(--gold-2); box-shadow: 0 0 0 2px var(--gold-2), 0 0 18px rgba(255,216,107,.5); }
#radial .lock { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; }
#radial .label { position: absolute; transform: translate(-50%, -50%); padding: 6px 10px; border-radius: var(--r-s); font-size: 13px; font-weight: 700; text-align: center; white-space: nowrap; pointer-events: none; animation: pop .2s var(--ease) both; }
#radial .label small { display: block; font-weight: 600; color: var(--text-2); font-size: 11px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
#radial .label { animation: none; }

/* tower sheet */
#sheet { position: fixed; left: calc(var(--safe-l) + 8px); right: calc(var(--safe-r) + 8px); bottom: calc(var(--bar-h) + var(--safe-b) + 16px); z-index: 13;
  border-radius: var(--r-xl); padding: 14px; animation: rise .25s var(--ease) both; max-width: 520px; margin: 0 auto; }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head img { width: 48px; height: 48px; }
.sheet-head .nm { font-size: 18px; font-weight: 800; }
.sheet-head .sub { font-size: 13px; color: var(--text-2); }
.stats { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.stat { flex: 1; min-width: 64px; padding: 6px 8px; border-radius: var(--r-s); background: rgba(0,0,0,.22); }
.stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); font-weight: 700; }
.stat .v { font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
.stat .v .up { color: var(--green); font-size: 12px; margin-left: 3px; }
.seg { display: flex; padding: 3px; border-radius: var(--r-s); background: rgba(0,0,0,.28); gap: 2px; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--text-2); }
.seg button.on { background: rgba(255,240,215,.16); color: var(--text); box-shadow: inset 0 1px 0 var(--glass-hi); }
.branches { display: flex; gap: 8px; }
.branch { flex: 1; padding: 10px; border-radius: var(--r-m); background: rgba(0,0,0,.22); border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 6px; }
.branch .bh { display: flex; align-items: center; gap: 6px; }
.branch img { width: 34px; height: 34px; }
.branch .bn { font-weight: 800; font-size: 14px; }
.branch .bd { font-size: 12px; color: var(--text-2); line-height: 1.3; flex: 1; }
.branch .btn { min-height: 38px; font-size: 14px; padding: 0 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; }
.label-s { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3); font-weight: 750; margin: 12px 2px 6px; }

/* ================= Screens ================= */
#screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; }
#screen:empty { display: none; }
#screen.dim::before { content: ""; position: absolute; inset: 0; -webkit-backdrop-filter: blur(10px) saturate(130%); backdrop-filter: blur(10px) saturate(130%); background: rgba(16,11,8,.42); z-index: -1; }
.scr { position: relative; flex: 1; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px); min-height: 0; animation: fade .25s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 44px; }
.topbar h2 { flex: 1; font-size: 26px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1; min-height: 0; margin: 0 -4px; padding: 0 4px 8px; }
.card { border-radius: var(--r-l); padding: 14px; }
.stack > * + * { margin-top: 10px; }

/* home */
.title { text-align: center; margin: 4vh 0 2vh; }
.title h1 { font-family: var(--font-display); font-size: clamp(48px, 15vw, 68px); line-height: 1; letter-spacing: 1px;
  background: linear-gradient(180deg, #fff3c9, #f0c25a 50%, #b07a1c); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(60,30,5,.7)) drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
.title .tag { margin-top: 8px; color: var(--text-2); font-size: 14px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
.lvl { display: flex; align-items: center; gap: 12px; }
.lvl .badge { width: 52px; height: 52px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #f6d27a, #b98424); color: var(--on-gold); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 12px rgba(232,181,74,.3); }
.lvl .badge small { font-size: 9px; font-weight: 800; letter-spacing: 1px; margin-bottom: -2px; }
.lvl .badge b { font-size: 22px; font-weight: 850; }
.xpbar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden; margin-top: 6px; }
.xpbar > i { display: block; height: 100%; background: linear-gradient(90deg, #d49b34, #ffd86b); border-radius: 4px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu .btn { min-height: 64px; flex-direction: column; gap: 2px; border-radius: var(--r-l); }
.menu .btn.wide { grid-column: span 2; min-height: 72px; font-size: 19px; }
.menu .btn small { font-size: 12px; font-weight: 600; opacity: .7; }
.menu .btn { position: relative; }
.dot { position: absolute; top: 8px; right: 10px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

/* campaign */
.world { position: relative; flex: 1; border-radius: var(--r-xl); overflow: hidden; min-height: 0; border: 1px solid var(--glass-border); box-shadow: var(--shadow-2); }
.world canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: pop .3s var(--ease) both; }
.node .tl { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1; }
.node .st { font-size: 10px; letter-spacing: 1px; color: var(--gold-2); margin-top: 2px; }
.node.done { border-color: rgba(255,216,107,.6); }
.node.next { box-shadow: 0 0 0 3px rgba(255,216,107,.85), 0 0 26px rgba(255,216,107,.55), var(--shadow-1); animation: pop .3s var(--ease) both, glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px rgba(255,216,107,.5), 0 0 12px rgba(255,216,107,.3), var(--shadow-1); } }
.node.locked { opacity: .6; } .node.locked .tl { opacity: .5; }
.node .nl { position: absolute; top: 68px; white-space: nowrap; font-size: 12px; font-weight: 750; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
.biome-tag { position: absolute; left: 12px; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px rgba(0,0,0,.7); }

/* bottom sheet (generic) */
.bsheet-wrap { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.25); animation: fade .2s both; }
.bsheet { width: 100%; max-width: 520px; margin: 0 8px calc(var(--safe-b) + 8px); border-radius: var(--r-xl); padding: 18px; animation: rise .25s var(--ease) both; }
.bsheet h3 { font-size: 22px; }

/* skills */
.tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0; }
.branchcol { display: flex; flex-direction: column; align-items: center; gap: 0; border-radius: var(--r-l); padding: 10px 4px; }
.branchcol .bt { font-size: 12px; font-weight: 850; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
.snode { width: 100%; max-width: 104px; padding: 7px 4px; border-radius: var(--r-m); text-align: center; background: rgba(0,0,0,.25); border: 1px solid var(--glass-border); position: relative; }
.snode .sn { font-size: 11.5px; font-weight: 750; line-height: 1.15; }
.snode .sr { font-size: 11px; color: var(--text-2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.snode .pips { display: flex; gap: 3px; justify-content: center; margin-top: 4px; }
.snode .pips i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.15); }
.snode .pips i.on { background: var(--c, var(--gold)); box-shadow: 0 0 6px var(--c, var(--gold)); }
.snode.ok { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.snode.maxed { background: rgba(255,216,107,.08); }
.snode.locked { opacity: .45; }
.link { width: 2px; height: 8px; background: rgba(255,255,255,.18); flex: none; }
.link.on { background: var(--c); }

/* codex */
.tcard { border-radius: var(--r-l); padding: 12px; }
.tcard .th { display: flex; align-items: center; gap: 12px; }
.tcard .th img { width: 56px; height: 56px; }
.tcard .th .nm { font-weight: 800; font-size: 17px; }
.tcard.locked .th img { filter: grayscale(1) brightness(.55); }
table.tt { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
table.tt th { text-align: left; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; padding: 4px 4px; }
table.tt td { padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.07); }

/* results */
.results { margin: auto 0; text-align: center; }
.results h1 { font-family: var(--font-display); font-size: 46px; }
.results.win h1 { background: linear-gradient(180deg, #fff3c9, #f0c25a 55%, #b07a1c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(60,30,5,.7)); }
.results.lose h1 { color: #ff8f80; }
.stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 6px; }
.stars svg { width: 54px; height: 54px; opacity: .2; transform: scale(.6); transition: transform .4s var(--ease), opacity .3s; }
.stars svg.on { opacity: 1; transform: scale(1); }
.stars svg:nth-child(2) { margin-top: -12px; }
.xplines { text-align: left; font-size: 14px; margin-top: 8px; }
.xplines div { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.07); }
.lvlup { font-weight: 850; color: var(--gold-2); animation: pop .4s var(--ease) both; }

/* settings */
.set-row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; }
.set-row + .set-row { border-top: 1px solid rgba(255,255,255,.07); }
.set-row .grow { flex: 1; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.15); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch.on { background: var(--green); } .switch.on::after { transform: translateX(20px); }

/* modal / toast / update / rotate */
#modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.35); animation: fade .15s both; }
#modal .box { width: 100%; max-width: 360px; border-radius: var(--r-xl); padding: 20px; text-align: center; animation: pop .22s var(--ease) both; }
#modal h3 { font-size: 21px; margin-bottom: 8px; }
#modal p { color: var(--text-2); font-size: 15px; line-height: 1.4; margin: 0 0 16px; }
#modal .acts { display: flex; flex-direction: column; gap: 8px; }
#toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 60px); transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: var(--r-pill); font-weight: 700; font-size: 14px; pointer-events: none; animation: rise .25s var(--ease) both; white-space: nowrap; }
#update { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 90px); z-index: 70; padding: 10px 16px; border-radius: var(--r-pill); font-weight: 750; font-size: 14px; color: var(--on-gold); background: linear-gradient(180deg, #f6d27a, #d49b34); box-shadow: var(--shadow-2); }
#rotate { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: var(--bg); font-weight: 700; color: var(--text-2); }
@media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) { #rotate { display: flex; } }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 28px; color: var(--gold); z-index: 5; }
</style>
</head>
<body>
<div id="boot">Holdfast</div>
<canvas id="cv"></canvas>
<div id="vignette"></div>
<div id="hud" class="hidden">
  <div class="pill glass hearts" id="hHearts"></div>
  <div class="pill glass" id="hGold"></div>
  <div class="grow"></div>
  <div class="pill glass" id="hWave"></div>
</div>
<div id="boss" class="glass hidden"><div class="name">Ogre Warlord</div><div class="track"><div class="fill" id="bossFill"></div></div></div>
<div id="bar" class="hidden">
  <button class="side glass" id="bSpeed" aria-label="Speed">1×</button>
  <button class="glass" id="callwave"><div class="lbl"><div class="t1" id="cw1">Start</div><div class="t2" id="cw2"></div></div><div class="foes" id="cwFoes"></div></button>
  <button class="side glass" id="bPause" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg></button>
</div>
<div id="radial" class="hidden"></div>
<div id="sheet" class="glass-strong hidden"></div>
<div id="screen"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="glass-strong hidden"></div>
<button id="update" class="hidden">Update ready · tap to reload</button>
<div id="rotate"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Turn your phone upright to play</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
